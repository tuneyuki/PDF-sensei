# ローカル開発用 DB（PostgreSQL 16 + pgvector）
#   docker compose -f docker/compose.yml up -d
#   export SENSEI_DSN=postgresql://sensei:sensei@localhost:5432/sensei
#   sensei db init
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sensei
      POSTGRES_PASSWORD: sensei
      POSTGRES_DB: sensei
    ports:
      - "${SENSEI_DB_PORT:-5432}:5432"
    volumes:
      - sensei-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensei -d sensei"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sensei-db:
