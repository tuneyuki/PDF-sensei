[project]
name = "pdf-sensei"
version = "0.1.0"
description = "EPUB/PDF の書籍を元に先生役のチャットボットを作るための入稿パイプライン"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
st = ["sentence-transformers>=3.0"]   # ローカル埋め込み（例: cl-nagoya/ruri-v3-310m）
voyage = ["voyageai>=0.3"]           # Voyage AI 埋め込み（VOYAGE_API_KEY）
gcp = ["google-genai>=1.0", "google-cloud-storage>=2.10"]   # Cloud Run 本番（Vertex AI・Cloud Storage）
dev = ["pytest>=8", "gcp-storage-emulator>=2024.0"]

[project.scripts]
sensei = "sensei.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
