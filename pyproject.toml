[project]
name = "pdf-sensei"
version = "0.1.0"
description = "EPUB/PDF の書籍を元に先生役のチャットボットを作るための入稿パイプライン"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "lxml>=5.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
sensei = "sensei.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
