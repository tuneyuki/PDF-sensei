# Pro Git 日本語版の検索評価セット。
# 質問はユーザーの言い方（見出しの言葉をなるべく避ける）で書き、正解は見出しの経路で示す。
# expected のどれか 1 つを含むチャンク（heading_path にその見出しが含まれる）が上位に来れば正解。
# "A > B" と書いた場合は A と B の両方を経路に含むこと。
name: progit-ja
language: ja
questions:
  - q: 間違って git add したファイルを、ステージから外したい
    expected: [ステージしたファイルの取り消し, git reset]
  - q: 直前のコミットメッセージを書き間違えたので直したい
    expected: [直近のコミットの変更, 作業のやり直し]
  - q: ビルドの成果物やログファイルを Git の管理対象から外したい
    expected: [ファイルの無視]
  - q: コミットに記録される名前とメールアドレスを設定するには？
    expected: [個人の識別情報]
  - q: 作業途中の変更をいったん退避して、別のブランチに切り替えたい
    expected: [自分の作業を隠す, ファイルを隠す機能の応用, git stash]
  - q: どのコミットでバグが混入したのかを効率よく突き止めたい
    expected: [二分探索, git bisect]
  - q: このファイルのこの行を最後に変更したのは誰か知りたい
    expected: [ファイルの注記, git blame]
  - q: マージしたら衝突が起きた。どうやって解決する？
    expected: [マージ時のコンフリクト, マージのコンフリクト]
  - q: リベースとマージはどちらを使うべき？
    expected: [リベースかマージか]
  - q: すでに公開したコミットをリベースすると何が困るの？
    expected: [ほんとうは怖いリベース, リベースした場合のリベース]
  - q: 細かく分かれた複数のコミットをひとつにまとめたい
    expected: [コミットのまとめ, reset を使ったコミットのまとめ]
  - q: 別のプロジェクトを自分のリポジトリの中に組み込んで使いたい
    expected: [サブモジュール]
  - q: プッシュのたびにパスワードを聞かれるのが面倒
    expected: [認証情報の保存]
  - q: Git が差分ではなくスナップショットでデータを持つとはどういうこと？
    expected: [スナップショットで、差分ではない]
  - q: 作業ディレクトリとステージングエリアと Git ディレクトリの関係を知りたい
    expected: [三つの状態, 3つのツリー]
  - q: 間違ってコミットしてしまったパスワード入りのファイルを履歴から完全に消したい
    expected: ["最強のオプション: filter-branch", オブジェクトの削除, git filter-branch]
  - q: コミットする前に自動でチェックを走らせたい
    expected: [クライアントサイドフック]
  - q: サーバー側で、決まりに反するプッシュを拒否したい
    expected: [サーバーサイドフック, Git ポリシーの実施例]
  - q: 消してしまったブランチのコミットを取り戻せる？
    expected: [データリカバリ, git reflog, 参照ログの短縮形]
  - q: GitHub で他人のプロジェクトに修正を送るにはどうする？
    expected: [プロジェクトのフォーク, GitHub Flow, GitHub > プロジェクトへの貢献]
  - q: Subversion で管理しているプロジェクトを Git に移行したい
    expected: [Git へ移行する > Subversion, Git と Subversion]
  - q: 自前のサーバーで Git リポジトリを共有したい
    expected: [サーバー用の Git の取得, サーバーのセットアップ, ベアリポジトリのサーバー上への設置]
  - q: SSH の鍵はどうやって作る？
    expected: [SSH 公開鍵の作成]
  - q: Windows と Mac で改行コードが違って差分が出てしまう
    expected: [書式設定と空白文字]
  - q: 画像や Word ファイルの差分をわかりやすく表示したい
    expected: [バイナリファイル]
  - q: よく使うコマンドを短く打てるようにしたい
    expected: [Git エイリアス]
  - q: リリースしたバージョンに印を付けておきたい
    expected: [タグの作成, 注釈付きのタグ, リリース用のタグ付け, タグ]
  - q: サーバー上のブランチを削除するには？
    expected: [リモートブランチの削除]
  - q: fetch と pull の違いは？
    expected: [リモートからのフェッチ、そしてプル, プル, git pull, git fetch]
  - q: コミット履歴を 1 行ずつ簡潔に表示したい
    expected: [コミット履歴の閲覧, git log]
  - q: 先週ある人が行ったコミットだけを一覧したい
    expected: [ログ出力の制限]
  - q: 別のブランチにある特定のコミットだけを取り込みたい
    expected: [提供された作業の取り込み, git cherry-pick]
  - q: Git の内部ではファイルの中身はどのように保存されている？
    expected: [Gitオブジェクト, オブジェクトストレージ]
  - q: HEAD とは何を指している？
    expected: [HEAD, ブランチの切り替え, 新しいブランチの作成, 3つのツリー]
  - q: 大規模なプロジェクトで、まとめ役を階層的に置く開発の進め方
    expected: [独裁者と副官型のワークフロー]
  - q: 良いコミットメッセージの書き方は？
    expected: [コミットの指針]
  - q: 追跡していない不要なファイルを作業ディレクトリから一掃したい
    expected: [作業ディレクトリの掃除, git clean]
  - q: 自分が作ったコミットであることを暗号的に証明したい
    expected: [作業内容への署名, コミットへの署名]
  - q: ファイルの変更の一部だけをコミットに含めたい
    expected: [対話的なステージング, パッチのステージ]
  - q: プログラムからプルリクエストの状態を更新したい
    expected: [プルリクエストのステータスの変更, GitHub API]
